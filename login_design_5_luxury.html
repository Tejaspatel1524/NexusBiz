<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusBiz Login - Design 5: Geometric Luxury</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            background: #000;
            color: white;
            overflow: hidden;
        }

        /* Left Brand Panel */
        .brand-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            overflow: hidden;
        }

        /* Geometric Pattern */
        .geo-pattern {
            position: absolute;
            inset: 0;
            opacity: 0.1;
        }

        .geo-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, #fff, transparent);
            height: 1px;
            animation: geo-slide 3s ease-in-out infinite;
        }

        .geo-line:nth-child(1) {
            top: 20%;
            width: 60%;
            left: 20%;
            animation-delay: 0s;
        }

        .geo-line:nth-child(2) {
            top: 40%;
            width: 80%;
            left: 10%;
            animation-delay: 0.5s;
        }

        .geo-line:nth-child(3) {
            top: 60%;
            width: 50%;
            left: 25%;
            animation-delay: 1s;
        }

        .geo-line:nth-child(4) {
            top: 80%;
            width: 70%;
            left: 15%;
            animation-delay: 1.5s;
        }

        @keyframes geo-slide {

            0%,
            100% {
                opacity: 0.1;
                transform: scaleX(1);
            }

            50% {
                opacity: 0.3;
                transform: scaleX(1.1);
            }
        }

        /* Diamond Shape */
        .diamond {
            width: 300px;
            height: 300px;
            position: relative;
            margin-bottom: 60px;
        }

        .diamond-inner {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(212, 175, 55, 0.3);
            transform: rotate(45deg);
            animation: diamond-pulse 4s ease-in-out infinite;
        }

        .diamond-inner::before {
            content: '';
            position: absolute;
            inset: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .diamond-inner::after {
            content: '';
            position: absolute;
            inset: 40px;
            border: 1px solid rgba(212, 175, 55, 0.1);
        }

        @keyframes diamond-pulse {

            0%,
            100% {
                transform: rotate(45deg) scale(1);
                opacity: 1;
            }

            50% {
                transform: rotate(45deg) scale(1.05);
                opacity: 0.8;
            }
        }

        .diamond-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #d4af37 0%, #f4e4bc 50%, #d4af37 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 900;
            color: #000;
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }

        .brand-text {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .brand-text h1 {
            font-size: 56px;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #fff 0%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-text p {
            margin-top: 12px;
            font-size: 13px;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: rgba(212, 175, 55, 0.6);
        }

        /* Right Form Panel */
        .form-panel {
            width: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            background: #0a0a0a;
            border-left: 1px solid rgba(212, 175, 55, 0.1);
        }

        .login-form {
            width: 100%;
        }

        .form-header {
            margin-bottom: 48px;
        }

        .form-header h2 {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #d4af37;
            margin-bottom: 12px;
        }

        .form-header h3 {
            font-size: 36px;
            font-weight: 800;
        }

        .input-group {
            margin-bottom: 28px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 12px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding: 16px 0;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            transition: all 0.3s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #d4af37;
        }

        .input-wrapper::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #d4af37, #f4e4bc);
            transition: width 0.3s;
        }

        .input-wrapper:focus-within::after {
            width: 100%;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #d4af37 0%, #f4e4bc 50%, #d4af37 100%);
            background-size: 200% 200%;
            color: #000;
            border: none;
            padding: 20px;
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            margin-top: 24px;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 50px rgba(212, 175, 55, 0.3);
            background-position: 100% 50%;
        }

        .form-footer {
            margin-top: 48px;
            padding-top: 32px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .social-login {
            display: flex;
            gap: 16px;
        }

        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .social-btn:hover {
            border-color: #d4af37;
            color: #d4af37;
        }

        .design-label {
            position: fixed;
            top: 24px;
            right: 24px;
            background: linear-gradient(135deg, #d4af37 0%, #f4e4bc 100%);
            padding: 14px 28px;
            font-size: 12px;
            font-weight: 700;
            color: #000;
        }
    </style>
</head>

<body>
    <div class="design-label">Design 5: Luxury</div>

    <div class="brand-panel">
        <div class="geo-pattern">
            <div class="geo-line"></div>
            <div class="geo-line"></div>
            <div class="geo-line"></div>
            <div class="geo-line"></div>
        </div>

        <div class="diamond">
            <div class="diamond-inner"></div>
            <div class="diamond-logo">N</div>
        </div>

        <div class="brand-text">
            <h1>NexusBiz</h1>
            <p>Premium Intelligence</p>
        </div>
    </div>

    <div class="form-panel">
        <div class="login-form">
            <div class="form-header">
                <h2>Welcome Back</h2>
                <h3>Access Your Account</h3>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <div class="input-wrapper">
                    <input type="email" placeholder="founder@startup.com">
                </div>
            </div>

            <div class="input-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <input type="password" placeholder="••••••••••••">
                </div>
            </div>

            <button class="submit-btn">Access Portal →</button>

            <div class="form-footer">
                <div class="social-login">
                    <button class="social-btn">G Google</button>
                    <button class="social-btn">⌘ GitHub</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
