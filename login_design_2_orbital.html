<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusBiz Login - Design 2: Orbital Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
            color: white;
            overflow: hidden;
        }

        /* Space Background */
        .space-bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(139, 92, 246, 0.06) 0%, transparent 50%);
        }

        /* Orbital Rings */
        .orbital-ring {
            position: fixed;
            border: 1px solid rgba(59, 130, 246, 0.1);
            border-radius: 50%;
            animation: orbit 20s linear infinite;
        }

        .ring-1 {
            width: 600px;
            height: 600px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(75deg);
        }

        .ring-2 {
            width: 800px;
            height: 800px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(75deg) rotateZ(30deg);
            animation-duration: 30s;
            animation-direction: reverse;
        }

        .ring-3 {
            width: 1000px;
            height: 1000px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(75deg) rotateZ(-15deg);
            animation-duration: 40s;
        }

        @keyframes orbit {
            from {
                transform: translate(-50%, -50%) rotateX(75deg) rotateZ(0deg);
            }

            to {
                transform: translate(-50%, -50%) rotateX(75deg) rotateZ(360deg);
            }
        }

        /* Particles */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: #3b82f6;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        .particle:nth-child(1) {
            top: 20%;
            left: 15%;
            animation-delay: 0s;
        }

        .particle:nth-child(2) {
            top: 30%;
            right: 20%;
            animation-delay: 0.5s;
        }

        .particle:nth-child(3) {
            bottom: 25%;
            left: 25%;
            animation-delay: 1s;
        }

        .particle:nth-child(4) {
            bottom: 35%;
            right: 15%;
            animation-delay: 1.5s;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
                box-shadow: 0 0 20px #3b82f6;
            }
        }

        /* Login Portal */
        .portal {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 56px 48px;
            box-shadow:
                0 0 80px rgba(59, 130, 246, 0.1),
                inset 0 0 80px rgba(59, 130, 246, 0.02);
        }

        .portal::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.3) 0%, transparent 50%, rgba(139, 92, 246, 0.3) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 48px;
        }

        .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 900;
            margin: 0 auto 20px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(59, 130, 246, 0.3);
        }

        .logo-section h1 {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .logo-section h1 span {
            color: #3b82f6;
        }

        .logo-section p {
            margin-top: 8px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #666;
        }

        .input-group {
            margin-bottom: 24px;
            position: relative;
        }

        .input-group label {
            position: absolute;
            top: -8px;
            left: 16px;
            background: #0a0a0a;
            padding: 0 8px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #3b82f6;
        }

        .input-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 24px;
            color: white;
            font-size: 14px;
            border-radius: 12px;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.15);
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
            border: none;
            padding: 20px;
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            cursor: pointer;
            border-radius: 12px;
            margin-top: 8px;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(59, 130, 246, 0.4);
        }

        .guest-btn {
            width: 100%;
            background: transparent;
            color: #666;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 12px;
            margin-top: 16px;
            transition: all 0.3s;
        }

        .guest-btn:hover {
            border-color: rgba(255, 255, 255, 0.2);
            color: white;
        }

        /* Trust Badges */
        .trust-badges {
            display: flex;
            gap: 16px;
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .badge {
            flex: 1;
            text-align: center;
            padding: 16px;
            background: rgba(59, 130, 246, 0.05);
            border-radius: 12px;
        }

        .badge-icon {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .badge h4 {
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #3b82f6;
        }

        .design-label {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            padding: 12px 24px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 50px;
        }
    </style>
</head>

<body>
    <div class="design-label">Design 2: Orbital</div>

    <div class="space-bg"></div>
    <div class="orbital-ring ring-1"></div>
    <div class="orbital-ring ring-2"></div>
    <div class="orbital-ring ring-3"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

    <div class="portal">
        <div class="logo-section">
            <div class="logo">N</div>
            <h1>Nexus<span>Biz</span></h1>
            <p>Access Portal</p>
        </div>

        <div class="input-group">
            <label>Neural Address</label>
            <input type="email" placeholder="user@nexusbiz.ai">
        </div>

        <div class="input-group">
            <label>Secret Key</label>
            <input type="password" placeholder="••••••••">
        </div>

        <button class="submit-btn">Access Portal →</button>
        <button class="guest-btn">Continue as Guest</button>

        <div class="trust-badges">
            <div class="badge">
                <div class="badge-icon">🔒</div>
                <h4>Zero-Cloud</h4>
            </div>
            <div class="badge">
                <div class="badge-icon">⚡</div>
                <h4>Neural AI</h4>
            </div>
        </div>
    </div>
</body>

</html>
