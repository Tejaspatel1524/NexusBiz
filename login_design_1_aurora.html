<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusBiz Login - Design 1: Aurora Split-Screen</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            background: #0a0a0a;
            color: white;
        }

        /* Left Panel - Aurora */
        .left-panel {
            flex: 1;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
            position: relative;
            overflow: hidden;
        }

        .aurora {
            position: absolute;
            width: 150%;
            height: 150%;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(59, 130, 246, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(139, 92, 246, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(6, 182, 212, 0.2) 0%, transparent 60%);
            animation: aurora-move 8s ease-in-out infinite;
        }

        @keyframes aurora-move {

            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            50% {
                transform: translate(-5%, 5%) rotate(2deg);
            }
        }

        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .shape {
            position: absolute;
            border: 1px solid rgba(59, 130, 246, 0.3);
            animation: float 6s ease-in-out infinite;
        }

        .shape-1 {
            width: 100px;
            height: 100px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 60px;
            height: 60px;
            top: 60%;
            left: 20%;
            animation-delay: 1s;
            transform: rotate(45deg);
        }

        .shape-3 {
            width: 80px;
            height: 80px;
            top: 30%;
            right: 15%;
            animation-delay: 2s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.5;
            }

            50% {
                transform: translateY(-20px) rotate(5deg);
                opacity: 0.8;
            }
        }

        .brand {
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: #3b82f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 900;
            margin: 0 auto 24px;
        }

        .brand h1 {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -2px;
            text-transform: uppercase;
        }

        .brand h1 span {
            color: #3b82f6;
        }

        .tagline {
            margin-top: 16px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #666;
        }

        /* Right Panel - Form */
        .right-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            background: #0a0a0a;
        }

        .login-form {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 48px;
            border-radius: 16px;
        }

        .form-header {
            margin-bottom: 40px;
        }

        .form-header h2 {
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #666;
            margin-bottom: 8px;
        }

        .form-header h3 {
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #666;
            margin-bottom: 12px;
        }

        .input-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.2);
            padding: 16px 20px;
            color: white;
            font-size: 14px;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        }

        .submit-btn {
            width: 100%;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 18px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 16px;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 32px 0;
            gap: 16px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #666;
        }

        .social-btns {
            display: flex;
            gap: 12px;
        }

        .social-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px;
            color: white;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .design-label {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #3b82f6;
            padding: 12px 24px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>
    <div class="design-label">Design 1: Aurora</div>

    <div class="left-panel">
        <div class="aurora"></div>
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
        </div>
        <div class="brand">
            <div class="logo">N</div>
            <h1>Nexus<span>Biz</span></h1>
            <p class="tagline">Strategic Intelligence Engine</p>
        </div>
    </div>

    <div class="right-panel">
        <div class="login-form">
            <div class="form-header">
                <h2>Neural Access</h2>
                <h3>Initialize Session</h3>
            </div>

            <div class="input-group">
                <label>Neural Address</label>
                <input type="email" placeholder="user@nexusbiz.ai">
            </div>

            <div class="input-group">
                <label>Secret Key</label>
                <input type="password" placeholder="••••••••">
            </div>

            <button class="submit-btn">Initialize →</button>

            <div class="divider"><span>or</span></div>

            <div class="social-btns">
                <button class="social-btn">● Google</button>
                <button class="social-btn">● GitHub</button>
            </div>
        </div>
    </div>
</body>

</html>
