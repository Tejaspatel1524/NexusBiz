<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusBiz Login - Design 4: Liquid Gradient</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f0f0f;
            color: white;
            overflow: hidden;
        }

        /* Animated Gradient Background */
        .gradient-bg {
            position: fixed;
            inset: 0;
            background: linear-gradient(-45deg, #0f0f0f, #1a0a2e, #0a1628, #0f0f0f);
            background-size: 400% 400%;
            animation: gradient-shift 15s ease infinite;
        }

        @keyframes gradient-shift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Liquid Blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            animation: blob-move 8s ease-in-out infinite;
        }

        .blob-1 {
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            top: -200px;
            left: -100px;
            opacity: 0.4;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            bottom: -150px;
            right: -100px;
            opacity: 0.3;
            animation-delay: 2s;
        }

        .blob-3 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.15;
            animation-delay: 4s;
        }

        @keyframes blob-move {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -30px) scale(1.05);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.95);
            }
        }

        /* Glass Container */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        /* Logo */
        .logo-area {
            text-align: center;
            margin-bottom: 48px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 900;
            margin: 0 auto 24px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(99, 102, 241, 0.4);
            animation: logo-glow 3s ease-in-out infinite;
        }

        @keyframes logo-glow {

            0%,
            100% {
                box-shadow: 0 20px 60px rgba(99, 102, 241, 0.4);
            }

            50% {
                box-shadow: 0 20px 80px rgba(168, 85, 247, 0.6);
            }
        }

        .logo-area h1 {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-area p {
            margin-top: 8px;
            font-size: 14px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Login Card */
        .login-card {
            width: 440px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 48px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
        }

        .tabs {
            display: flex;
            gap: 8px;
            padding: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            margin-bottom: 40px;
        }

        .tab {
            flex: 1;
            padding: 16px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s;
        }

        .tab.active {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 12px;
        }

        .input-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px 24px;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            border-radius: 16px;
            transition: all 0.3s;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .input-group input:focus {
            outline: none;
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.1);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.2);
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            background-size: 200% 200%;
            color: white;
            border: none;
            padding: 20px;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 16px;
            margin-top: 8px;
            transition: all 0.3s;
            animation: btn-gradient 3s ease infinite;
        }

        @keyframes btn-gradient {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 50px rgba(99, 102, 241, 0.4);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 32px 0;
            gap: 16px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }

        .social-btns {
            display: flex;
            gap: 12px;
        }

        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 14px;
            transition: all 0.3s;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .social-icon {
            font-size: 18px;
        }

        .design-label {
            position: fixed;
            top: 24px;
            right: 24px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            padding: 14px 28px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>

<body>
    <div class="design-label">Design 4: Liquid</div>

    <div class="gradient-bg"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="container">
        <div class="logo-area">
            <div class="logo">N</div>
            <h1>NexusBiz</h1>
            <p>AI Business Engine</p>
        </div>

        <div class="login-card">
            <div class="tabs">
                <button class="tab active">Sign In</button>
                <button class="tab">Create Account</button>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" placeholder="hello@nexusbiz.ai">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password">
            </div>

            <button class="submit-btn">Continue →</button>

            <div class="divider"><span>or continue with</span></div>

            <div class="social-btns">
                <button class="social-btn"><span class="social-icon">G</span> Google</button>
                <button class="social-btn"><span class="social-icon">⌘</span> GitHub</button>
            </div>
        </div>
    </div>
</body>

</html>
